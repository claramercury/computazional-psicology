[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "lattix-sim"
version = "0.1.0"
description = "Simulación psicométrica del framework Lattix 01 para análisis de coordinación multiagente en sistemas LLM"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Clara Mercury", email = "clara@the-latix-project.org"},
]
keywords = ["psychometrics", "computational-psychology", "multi-agent", "LLM", "lattix"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.10",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "scikit-learn>=1.3",
    "factor-analyzer>=0.5",
]

[project.urls]
Homepage = "https://the-latix-project.org/"
Repository = "https://github.com/claramercury/computazional-psicology"

[tool.setuptools.packages.find]
include = ["lattix_sim*"]
